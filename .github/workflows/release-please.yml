# Single source of truth for cutting and publishing releases.
#
# release-please-action reads Conventional Commits on main and opens a
# release PR that bumps package.json + CHANGELOG.md + the manifest.
# Merging that release PR sets `release_created = true`, and the publish
# job runs in the SAME workflow.
#
# Why publish lives here instead of a separate `on: release: published`
# workflow: release-please-action uses the default GITHUB_TOKEN, and
# GitHub's recursion guard prevents events created by GITHUB_TOKEN from
# triggering downstream workflows. A separate release-triggered workflow
# would never fire under that token. Folding publish into this workflow
# avoids the PAT/App-token rotation cost AND the foot-gun.
#
# Manual re-publish recovery still works via the standalone publish-npm.yml
# (workflow_dispatch only).
#
# Synced from nebula-sdks/custom/downstream-ts/.github/workflows/release-please.yml
# by the upstream nebula-sdk-sync.yml workflow. Edit the template, not the
# downstream copy.

name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install

      - name: Build dist/
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
