# Manual re-publish recovery for @nebula-ai/sdk.
#
# The PRIMARY publish path lives in release-please.yml — it runs the
# publish job conditional on `release_created == 'true'` in the same
# workflow as the release-PR merge. That avoids the GITHUB_TOKEN
# recursion guard (a `release: published` trigger would never fire when
# release-please-action creates the release via the default token).
#
# This workflow exists only for the rare case where the automatic
# publish failed mid-run (npm hiccup, transient build failure) and an
# operator needs to re-publish the same tag. Trigger it from the
# Actions UI with workflow_dispatch.
#
# Synced from nebula-sdks/custom/downstream-ts/.github/workflows/publish-npm.yml
# by the upstream nebula-sdk-sync.yml workflow. Edit the template, not the
# downstream copy.

name: Publish NPM (manual recovery)

on:
  workflow_dispatch:

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install

      - name: Build dist/
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
