# Publish @nebula-ai/sdk to npm. Triggered by `release: published` (created
# by the nebula-sdk-bot GitHub App in release-please.yml), or manually via
# workflow_dispatch for re-publish recovery.
#
# Channel routing:
#   - Plain semver (1.6.0)                  → `--tag latest` (stable)
#   - Pre-release semver (1.6.0-rc.1, etc.) → `--tag next`  (iteration)
#
# Consumers running `npm install @nebula-ai/sdk` get whatever `latest`
# points to (stable only). Consumers opting in to the iteration channel
# do `npm install @nebula-ai/sdk@next`. Caret ranges (`^1.6.0`) never
# auto-pick pre-releases — semver excludes them unless explicitly named.
#
# Authentication is npm OIDC trusted publishing — no NPM_TOKEN secret.
# The trusted publisher must be configured on npmjs.com for the
# `@nebula-ai/sdk` package with:
#   - Org: zeroset-inc
#   - Repo: nebula-typescript
#   - Workflow filename: publish-npm.yml
#   - Environment: release
#
# OIDC publishing requires npm 11.5+; setup-node ships an older npm, so
# we install npm@11.6.2 explicitly into a side directory and point
# `npm publish` at that binary.
#
# Provenance attestations: `--provenance` makes npm sign the package with
# a GitHub Actions OIDC token, producing an attestation that npm displays
# as "Built and signed on GitHub Actions" on the package page.
#
# Synced from nebula-sdks/custom/downstream-ts/.github/workflows/publish-npm.yml
# by the upstream nebula-sdk-sync.yml workflow. Edit the template, not the
# downstream copy.

name: Publish NPM

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install

      - name: Build dist/
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm@11.6.2 (required for OIDC trusted publishing)
        run: npm install --prefix ../oidc-npm npm@11.6.2

      - name: Resolve dist-tag from version
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          # Semver pre-release versions contain a `-` (e.g. 1.6.0-rc.1).
          # Plain semver releases (1.6.0) go to `latest`; everything else
          # goes to `next` so `npm install <pkg>` doesn't auto-pick them.
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version with --tag $tag"

      - name: Publish to npm with provenance via OIDC
        run: ../oidc-npm/node_modules/.bin/npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}
