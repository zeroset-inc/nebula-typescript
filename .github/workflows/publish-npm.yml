# Publish @nebula-ai/sdk to npm. Triggered by `release: published` (created
# by the nebula-sdk-bot GitHub App in release-please.yml), or manually via
# workflow_dispatch for re-publish recovery.
#
# Channel routing:
#   - Plain semver (1.6.0)                  -> `--tag latest` (stable)
#   - Pre-release semver (1.6.0-rc.1, etc.) -> `--tag next`  (iteration)
#
# Consumers running `npm install @nebula-ai/sdk` get whatever `latest`
# points to. Consumers opting in to the iteration channel install
# `@nebula-ai/sdk@next`. Caret ranges never auto-pick pre-releases unless
# explicitly named.
#
# Two-job structure:
#   preflight  -> no environment, fast version/tag resolution + sentinel
#                guard. Runs immediately on every dispatch/trigger.
#   publish    -> needs preflight, gated on `environment: release`
#                (reviewer approval). Only requests approval AFTER the
#                preflight has confirmed there is something real to publish.
#
# Authentication is npm OIDC trusted publishing -- no NPM_TOKEN secret.
# The trusted publisher must be configured on npmjs.com for @nebula-ai/sdk.
#
# Synced from nebula-sdks/custom/downstream-ts/.github/workflows/publish-npm.yml
# by the upstream nebula-sdk-sync.yml workflow. Edit the template, not the
# downstream copy.

name: Publish NPM

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dist-tag from version
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *from-source* ]]; then
            echo "::error::Refusing to publish sentinel version '$version'. Dispatch this workflow against a release tag, not main."
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version with --tag $tag"

  publish:
    name: publish
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install

      - name: Build dist/
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm@11.6.2 (required for OIDC trusted publishing)
        run: npm install --prefix ../oidc-npm npm@11.6.2

      - name: Publish to npm with provenance via OIDC
        run: ../oidc-npm/node_modules/.bin/npm publish --ignore-scripts --provenance --access public --tag ${{ needs.preflight.outputs.tag }}
